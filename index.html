<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102e37"><meta name="description" content="水果从天而降，用手指或鼠标轻轻一划，切开快乐！">
<title>水果切切乐</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23102e37'/%3E%3Cpath d='M12 23a22 22 0 0 0 40 0Z' fill='%23b8e96a'/%3E%3Cpath d='M16 25a18 18 0 0 0 32 0Z' fill='%23ff6b7c'/%3E%3Cpath d='m25 30 2 4m9-4-1 5' stroke='%23102e37' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-shell">
<header class="toolbar">
<div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><div><h1>水果切切乐</h1><p>划一下，快乐就开花</p></div></div>
<div class="controls"><div class="score-box"><span>得分</span><output id="score" aria-label="得分">0</output></div><button id="restart" class="icon-button" aria-label="重新开始" title="重新开始"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.6 7M4 4v6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</header>
<section class="playground" aria-label="水果游戏区">
<canvas id="game" tabindex="0" aria-label="水果切切乐。按住鼠标或用手指划过水果。也可以按空格切水果。">你的浏览器不支持画布，请换一个较新的浏览器再试。</canvas>
<div class="board-top"><span class="mode"><i></i>轻松畅玩</span><span class="fruit-count" id="fruit-count">切开 0 个水果</span></div>
<div class="welcome" id="welcome">
<div class="fruit-parade" aria-hidden="true"><span>🍊</span><span>🍉</span><span>🥝</span></div>
<span class="eyebrow">准备好了吗？</span><h2>把快乐<br>切出来！</h2>
<p>水果掉下来，手指划过去<br>电脑上按住鼠标，划一下就好</p>
<button class="start-button" id="start">开始切水果 <span aria-hidden="true">✦</span></button>
<div class="welcome-note">没有炸弹，漏掉也没关系</div>
</div>
<div class="pause-panel" id="pause-panel" hidden><h2>休息一下</h2><button class="start-button" id="resume">继续切水果 <span aria-hidden="true">✦</span></button></div>
<div class="tip" id="tip" aria-hidden="true"><span>✧</span> 按住鼠标或用手指划过水果</div>
<div id="announcement" class="sr-only" aria-live="polite"></div>
</section>
<footer><span><span class="tiny-star" aria-hidden="true">✦</span> 小小一划，果汁四溅</span><span class="keyboard-hint">也可以按空格切水果</span></footer>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
